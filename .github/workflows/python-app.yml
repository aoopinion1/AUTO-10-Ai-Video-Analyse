name: AUTO-10 Scheduled Production Pipeline

on:
  schedule:
    # Runs 6 times a day (every 4 hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Allows manual "Run workflow" click anytime

jobs:
  run-auto10:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Prevents stuck jobs (GitHub free limit is 360 mins)

    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Clone Engine Code from Main Account
        env:
          MAIN_TOKEN: ${{ secrets.MAIN_GITHUB_TOKEN }}
        run: |
          CLEAN_TOKEN=$(echo -n "$MAIN_TOKEN" | tr -d '\r\n[:space:]')
          # Check that token is not empty
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "ERROR: MAIN_GITHUB_TOKEN secret is empty! Check secret name in repo settings."
            exit 1
          fi
          # Clone using username shivank-shiv and the token
          git clone "https://shivank-shiv:${CLEAN_TOKEN}@github.com/shivank-shiv/AUTO-10.git" auto10_engine

      - name: Install PyTorch CPU (Saves 10GB+ Disk Space)
        run: |
          pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install Other Python Requirements
        run: |
          cd auto10_engine
          pip install --no-cache-dir -r requirements.txt

      - name: Run Auto10 Engine
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GCS_API: ${{ secrets.GCS_API }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_REFRESH_TOKEN: ${{ secrets.IG_REFRESH_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          IG_ID: ${{ secrets.IG_ID }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          WHISPER_MODEL: ${{ secrets.WHISPER_MODEL || 'medium' }}
        run: |
          cd auto10_engine
          # Write environment variables expanding them properly:
          cat << EOF > .env
          GCS_API='$GCS_API'
          DRIVE_FOLDER_ID='$DRIVE_FOLDER_ID'
          GEMINI_API_KEY='$GEMINI_API_KEY'
          IG_REFRESH_TOKEN='$IG_REFRESH_TOKEN'
          APP_ID='$APP_ID'
          APP_SECRET='$APP_SECRET'
          IG_ID='$IG_ID'
          YOUTUBE_REFRESH_TOKEN='$YOUTUBE_REFRESH_TOKEN'
          CLIENT_ID='$CLIENT_ID'
          CLIENT_SECRET='$CLIENT_SECRET'
          WHISPER_MODEL='$WHISPER_MODEL'
          EOF
          
          python ai_video_explainer_engine.py
